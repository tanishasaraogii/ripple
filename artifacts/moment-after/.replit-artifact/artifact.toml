kind = "web"
previewPath = "/"
title = "The Moment After"
version = "1.0.0"
id = "artifacts/moment-after"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25165

[services.development]
run = "pnpm --filter @workspace/moment-after run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moment-after", "run", "build" ]
publicDir = "artifacts/moment-after/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25165"
BASE_PATH = "/"
